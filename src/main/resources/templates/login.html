<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(-45deg, #667eea, #764ba2, #6a11cb, #2575fc);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .card {
            width: 350px;
            border-radius: 20px;
            padding: 25px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(30px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .btn-custom {
            background: #667eea;
            color: white;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            background: #5a67d8;
        }
    </style>
</head>

<body>

<div class="card shadow">
    <h3 class="text-center mb-4">🔐 Login</h3>

    <form action="/uploadPage" method="get">
        <input type="text" class="form-control mb-3" placeholder="Username" required>
        <input type="password" class="form-control mb-3" placeholder="Password" required>

        <button class="btn btn-custom w-100">Login</button>
    </form>
</div>

</body>
</html>
