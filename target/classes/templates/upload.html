<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upload Resume</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #43cea2, #185a9d);
            min-height: 100vh;
        }

        .container {
            margin-top: 60px;
        }

        .card {
            border-radius: 20px;
            padding: 30px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .btn-custom {
            background: #43cea2;
            color: white;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            background: #2fa88c;
        }

        .upload-box {
            border: 2px dashed #ccc;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }

        .upload-box:hover {
            background: #f8f9fa;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card shadow">

        <h3 class="text-center mb-4">📤 Upload Resume</h3>

        <form action="/upload" method="post" enctype="multipart/form-data">

            <!-- File Upload -->
            <div class="upload-box mb-3">
                <input type="file" name="file" class="form-control" required>
                <small>Drag & drop or select file</small>
            </div>

            <!-- Skills Input -->
            <input type="text" name="skills" class="form-control mb-3"
                   placeholder="Enter skills (Java, Python, React)" required>

            <button class="btn btn-custom w-100">Analyze Resume</button>
        </form>

        <!-- ❌ Error -->
        <div th:if="${error}" class="alert alert-danger text-center mt-3">
            <p th:text="${error}"></p>
        </div>

        <!-- ✅ Success -->
        <div th:if="${success}" class="alert alert-success text-center mt-3">
            <p th:text="${success}"></p>
        </div>

        <a href="/dashboard" class="btn btn-dark w-100 mt-3">📊 View Dashboard</a>

    </div>
</div>

</body>
</html>
